# gastro-ekg-funnel (Static / Eleventy)
# empfehlen.gastro-einkaufsgemeinschaft.de - Empfehlungslink-Generator
# Docroot ist der Release-Symlink, s. bin/deploy.sh

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name empfehlen.gastro-einkaufsgemeinschaft.de;

    location /.well-known/acme-challenge/ {
        root /var/www/gastro-ekg-funnel/current;
    }
    location / {
        return 301 https://empfehlen.gastro-einkaufsgemeinschaft.de$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name empfehlen.gastro-einkaufsgemeinschaft.de;

    ssl_certificate     /etc/letsencrypt/live/empfehlen.gastro-einkaufsgemeinschaft.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/empfehlen.gastro-einkaufsgemeinschaft.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/gastro-ekg-funnel/current;
    index index.html;

    access_log /var/log/nginx/gastro-ekg-funnel.access.log;
    error_log  /var/log/nginx/gastro-ekg-funnel.error.log warn;

    charset utf-8;

    gzip            on;
    gzip_types      text/plain application/xml text/css application/javascript image/svg+xml;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ $uri.html =404;

        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Bilder + Fonts - 1 Jahr immutable (hero.jpeg ist ~490 KB)
    location ~* \.(avif|webp|png|jpe?g|gif|svg|ico|woff2?|ttf|otf|eot)$ {
        access_log off;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(css|js|mjs)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
